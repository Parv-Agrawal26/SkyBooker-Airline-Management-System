spring.application.name=flight-service
server.port=${FLIGHT_SERVICE_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:h2:mem:flightdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

jwt.secret=${JWT_SECRET}

# Internal service URLs
seat.service.url=${SEAT_SERVICE_URL:http://localhost:8086}
