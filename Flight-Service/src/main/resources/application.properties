spring.application.name=flight-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/skybooker_flight_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Must match auth-service jwt.secret exactly
jwt.secret=my-super-secret-key-my-super-secret-key-12345

# Internal service URLs
seat.service.url=http://localhost:8086