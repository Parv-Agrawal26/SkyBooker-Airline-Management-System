<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Booking Created</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:20px">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:8px;padding:30px">
    <h2 style="color:#1a73e8">Booking Created ✈</h2>
    <p>Your booking <strong>#<span th:text="${bookingId}"></span></strong> has been created successfully.</p>
    <table style="width:100%;border-collapse:collapse;margin-top:16px">
      <tr><td style="padding:8px;color:#555">From</td><td style="padding:8px"><strong th:text="${source}"></strong></td></tr>
      <tr style="background:#f9f9f9"><td style="padding:8px;color:#555">To</td><td style="padding:8px"><strong th:text="${destination}"></strong></td></tr>
      <tr><td style="padding:8px;color:#555">Date</td><td style="padding:8px" th:text="${departureDate}"></td></tr>
      <tr style="background:#f9f9f9"><td style="padding:8px;color:#555">Time</td><td style="padding:8px" th:text="${departureTime}"></td></tr>
      <tr><td style="padding:8px;color:#555">Airline</td><td style="padding:8px" th:text="${airline}"></td></tr>
    </table>
    <p style="margin-top:20px">Please complete your payment to confirm the booking.</p>
    <p style="color:#888;font-size:12px">— The SkyBooker Team</p>
  </div>
</body>
</html>
