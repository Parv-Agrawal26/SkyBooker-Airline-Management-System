<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Password Reset Code</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:20px">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:8px;padding:30px">
    <h2 style="color:#1a73e8">SkyBooker Password Reset</h2>
    <p>Hi <strong th:text="${userName}">User</strong>,</p>
    <p>Use this code to reset your password:</p>
    <p style="font-size:24px;font-weight:bold;color:#333;letter-spacing:2px;"> <span th:text="${otp}">000000</span> </p>
    <p>This code will expire in 10 minutes.</p>
    <p>If you did not request a password reset, please ignore this email.</p>
    <p style="color:#888;font-size:12px">— The SkyBooker Team</p>
  </div>
</body>
</html>
