spring.application.name=booking-service
server.port=${BOOKING_SERVICE_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skybooker_booking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

jwt.secret=${JWT_SECRET}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Internal service URLs
flight.service.url=${FLIGHT_SERVICE_URL:http://localhost:8082}
passenger.service.url=${PASSENGER_SERVICE_URL:http://localhost:8084}
seat.service.url=${SEAT_SERVICE_URL:http://localhost:8086}
